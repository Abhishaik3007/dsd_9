openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Multi-tenant QR ordering API
servers:
  - url: /api
    description: Shared API service
tags:
  - name: app
    description: Authenticated admin and client operations
  - name: store
    description: Public customer ordering operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [app]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [app]
      summary: Resolve the signed-in user's role and business access
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [app]
      summary: Get role-scoped dashboard summary and recent orders
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /businesses:
    get:
      operationId: listBusinesses
      tags: [app]
      summary: List businesses visible to the current user
      responses:
        "200":
          description: Businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
    post:
      operationId: createBusiness
      tags: [app]
      summary: Create a business and invite its owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Created business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
  /businesses/{businessId}:
    patch:
      operationId: updateBusiness
      tags: [app]
      summary: Update a business, activation, or subscription
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
  /team:
    get:
      operationId: listTeam
      tags: [app]
      summary: List members and pending invitations
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: inviteTeamMember
      tags: [app]
      summary: Invite a user to a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
  /plans:
    get:
      operationId: listPlans
      tags: [app]
      summary: List subscription plans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags: [app]
      summary: Create a subscription plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
  /outlets:
    get:
      operationId: listOutlets
      tags: [app]
      summary: List outlets visible to the current user
      responses:
        "200":
          description: Outlets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Outlet"
    post:
      operationId: createOutlet
      tags: [app]
      summary: Create an outlet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutletInput"
      responses:
        "201":
          description: Created outlet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outlet"
  /outlets/{outletId}:
    patch:
      operationId: updateOutlet
      tags: [app]
      summary: Update an outlet
      parameters:
        - $ref: "#/components/parameters/OutletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutletUpdate"
      responses:
        "200":
          description: Updated outlet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outlet"
    delete:
      operationId: deleteOutlet
      tags: [app]
      summary: Remove an outlet
      parameters:
        - $ref: "#/components/parameters/OutletId"
      responses:
        "204":
          description: Removed
  /categories:
    get:
      operationId: listCategories
      tags: [app]
      summary: List menu categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [app]
      summary: Create a menu category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /categories/{categoryId}:
    patch:
      operationId: updateCategory
      tags: [app]
      summary: Update a category
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [app]
      summary: Remove a category
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "204":
          description: Removed
  /items:
    get:
      operationId: listItems
      tags: [app]
      summary: List menu items
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createItem
      tags: [app]
      summary: Create a menu item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "201":
          description: Created menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
  /items/{itemId}:
    patch:
      operationId: updateItem
      tags: [app]
      summary: Update a menu item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemUpdate"
      responses:
        "200":
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
    delete:
      operationId: deleteItem
      tags: [app]
      summary: Remove a menu item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: Removed
  /orders:
    get:
      operationId: listOrders
      tags: [app]
      summary: List orders visible to the current user
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /orders/{orderId}:
    patch:
      operationId: updateOrder
      tags: [app]
      summary: Update order status
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /analytics:
    get:
      operationId: getAnalytics
      tags: [app]
      summary: Get sales and order analytics for the current scope
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
  /store/{business}/{outlet}/{table}:
    get:
      operationId: getStoreMenu
      tags: [store]
      summary: Resolve a QR location and return its customer menu
      parameters:
        - name: business
          in: path
          required: true
          schema: { type: string }
        - name: outlet
          in: path
          required: true
          schema: { type: string }
        - name: table
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Menu and table context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreMenu"
  /store/orders:
    post:
      operationId: placeStoreOrder
      tags: [store]
      summary: Place a customer order without an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOrderInput"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
components:
  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: { type: string }
    OutletId:
      name: outletId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Sign in required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties: { status: { type: string } }
      required: [status]
    Error:
      type: object
      properties: { error: { type: string } }
      required: [error]
    CurrentUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [super_admin, business_admin, staff, pending] }
        businessId: { type: ["string", "null"] }
        businessName: { type: ["string", "null"] }
        status: { type: string }
      required: [id, email, name, role, status]
    Business:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        type: { type: string, enum: [Restaurant, Hotel, Cinema/Theatre] }
        status: { type: string, enum: [active, suspended, inactive, pending] }
        ownerEmail: { type: string }
        planId: { type: ["string", "null"] }
        planName: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"], format: date-time }
        outletCount: { type: integer }
        orderCount: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, name, slug, type, status, ownerEmail, outletCount, orderCount, createdAt]
    BusinessInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [Restaurant, Hotel, Cinema/Theatre] }
        ownerEmail: { type: string, format: email }
        password: { type: string, minLength: 6 }
        planId: { type: string }
        expiresAt: { type: ["string", "null"], format: date-time }
      required: [name, type, ownerEmail]
    BusinessUpdate:
      type: object
      properties:
        name: { type: string }
        type: { type: string, enum: [Restaurant, Hotel, Cinema/Theatre] }
        status: { type: string, enum: [active, suspended, inactive] }
        planId: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"], format: date-time }
    TeamMember:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [super_admin, business_admin, staff, pending] }
        status: { type: string, enum: [active, invited, suspended] }
        businessId: { type: ["string", "null"] }
        businessName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, email, name, role, status, createdAt]
    InviteInput:
      type: object
      properties:
        email: { type: string, format: email }
        businessId: { type: ["string", "null"] }
        role: { type: string, enum: [business_admin, staff] }
      required: [email, role]
    Plan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number }
        interval: { type: string, enum: [month, year] }
        outletLimit: { type: integer }
        itemLimit: { type: integer }
        active: { type: boolean }
      required: [id, name, price, interval, outletLimit, itemLimit, active]
    PlanInput:
      type: object
      properties:
        name: { type: string }
        price: { type: number, minimum: 0 }
        interval: { type: string, enum: [month, year] }
        outletLimit: { type: integer, minimum: 1 }
        itemLimit: { type: integer, minimum: 1 }
      required: [name, price, interval, outletLimit, itemLimit]
    Outlet:
      type: object
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        slug: { type: string }
        address: { type: string }
        active: { type: boolean }
        tableCount: { type: integer }
      required: [id, businessId, name, slug, address, active, tableCount]
    OutletInput:
      type: object
      properties:
        businessId: { type: string }
        name: { type: string }
        address: { type: string }
        tableCount: { type: integer, minimum: 1 }
      required: [businessId, name, address, tableCount]
    OutletUpdate:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        active: { type: boolean }
        tableCount: { type: integer, minimum: 1 }
    Category:
      type: object
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
      required: [id, businessId, name, sortOrder]
    CategoryInput:
      type: object
      properties:
        businessId: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
      required: [businessId, name]
    CategoryUpdate:
      type: object
      properties:
        name: { type: string }
        sortOrder: { type: integer }
    MenuChoice:
      type: object
      properties:
        name: { type: string }
        price: { type: number }
      required: [name, price]
    MenuItem:
      type: object
      properties:
        id: { type: string }
        businessId: { type: string }
        categoryId: { type: string }
        categoryName: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        imageUrl: { type: string }
        available: { type: boolean }
        variants: { type: array, items: { $ref: "#/components/schemas/MenuChoice" } }
        addOns: { type: array, items: { $ref: "#/components/schemas/MenuChoice" } }
      required: [id, businessId, categoryId, categoryName, name, description, price, imageUrl, available, variants, addOns]
    MenuItemInput:
      type: object
      properties:
        businessId: { type: string }
        categoryId: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number, minimum: 0 }
        imageUrl: { type: string }
        available: { type: boolean }
        variants: { type: array, items: { $ref: "#/components/schemas/MenuChoice" } }
        addOns: { type: array, items: { $ref: "#/components/schemas/MenuChoice" } }
      required: [businessId, categoryId, name, price]
    MenuItemUpdate:
      type: object
      properties:
        categoryId: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number, minimum: 0 }
        imageUrl: { type: string }
        available: { type: boolean }
        variants: { type: array, items: { $ref: "#/components/schemas/MenuChoice" } }
        addOns: { type: array, items: { $ref: "#/components/schemas/MenuChoice" } }
    OrderLine:
      type: object
      properties:
        itemId: { type: string }
        name: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        selectedVariant: { type: string }
        selectedAddOns: { type: array, items: { type: string } }
      required: [itemId, name, quantity, unitPrice, selectedVariant, selectedAddOns]
    Order:
      type: object
      properties:
        id: { type: string }
        businessId: { type: string }
        businessName: { type: string }
        outletId: { type: string }
        outletName: { type: string }
        tableNumber: { type: string }
        customerName: { type: string }
        customerPhone: { type: string }
        status: { type: string, enum: [new, preparing, ready, completed, cancelled] }
        total: { type: number }
        items: { type: array, items: { $ref: "#/components/schemas/OrderLine" } }
        createdAt: { type: string, format: date-time }
      required: [id, businessId, businessName, outletId, outletName, tableNumber, customerName, customerPhone, status, total, items, createdAt]
    OrderUpdate:
      type: object
      properties:
        status: { type: string, enum: [new, preparing, ready, completed, cancelled] }
      required: [status]
    StoreMenu:
      type: object
      properties:
        business: { $ref: "#/components/schemas/Business" }
        outlet: { $ref: "#/components/schemas/Outlet" }
        tableNumber: { type: string }
        categories: { type: array, items: { $ref: "#/components/schemas/Category" } }
        items: { type: array, items: { $ref: "#/components/schemas/MenuItem" } }
      required: [business, outlet, tableNumber, categories, items]
    StoreOrderInput:
      type: object
      properties:
        businessSlug: { type: string }
        outletSlug: { type: string }
        tableNumber: { type: string }
        customerName: { type: string }
        customerPhone: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/OrderLine" }, minItems: 1 }
      required: [businessSlug, outletSlug, tableNumber, customerName, items]
    Dashboard:
      type: object
      properties:
        businessCount: { type: integer }
        activeBusinessCount: { type: integer }
        orderCount: { type: integer }
        revenue: { type: number }
        pendingOrderCount: { type: integer }
        recentOrders: { type: array, items: { $ref: "#/components/schemas/Order" } }
        orderTrend: { type: array, items: { $ref: "#/components/schemas/TrendPoint" } }
      required: [businessCount, activeBusinessCount, orderCount, revenue, pendingOrderCount, recentOrders, orderTrend]
    TrendPoint:
      type: object
      properties:
        label: { type: string }
        orders: { type: integer }
        revenue: { type: number }
      required: [label, orders, revenue]
    Analytics:
      type: object
      properties:
        orderCount: { type: integer }
        revenue: { type: number }
        averageOrder: { type: number }
        completedCount: { type: integer }
        trend: { type: array, items: { $ref: "#/components/schemas/TrendPoint" } }
        topItems: { type: array, items: { $ref: "#/components/schemas/TopItem" } }
      required: [orderCount, revenue, averageOrder, completedCount, trend, topItems]
    TopItem:
      type: object
      properties:
        name: { type: string }
        quantity: { type: integer }
        revenue: { type: number }
      required: [name, quantity, revenue]

